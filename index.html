<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redcrdd Builder</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0b0b10;color:#eee;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
[hidden]{display:none!important}

header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #22222c;background:#0f0f16}
.brand{margin-right:6px;font-size:16px;font-weight:800;background:linear-gradient(120deg,#ff3b4e,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
input,select,button{font:inherit;color:inherit;background:#17171f;border:1px solid #2a2a36;border-radius:10px;padding:8px 10px}
input{width:130px}
button{cursor:pointer}
button.primary{background:linear-gradient(120deg,#ff3b4e,#ff8a5b);border:0;color:#fff;font-weight:600}

.main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid #22222c}
.pane:last-child{border-right:0}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid #22222c;background:#0f0f16}
.tab{background:transparent;border:0;padding:7px 12px;border-radius:8px;color:#aaa}
.tab.on{background:#1f1f2a;color:#fff}

#editor{flex:1;width:100%;resize:none;border:0;outline:0;background:#0b0b10;color:#e8e8f2;padding:14px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;tab-size:2}
#frame{flex:1;width:100%;border:0;background:#fff}
#console{flex:1;margin:0;padding:14px;overflow:auto;background:#07070b;color:#cfe;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}

@media(max-width:800px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .pane{border-right:0;border-bottom:1px solid #22222c}
  input{width:110px}
}
</style>
</head>
<body>

<header>
  <span class="brand">Redcrdd Builder</span>
  <input id="name" value="my-site" aria-label="Project name">
  <select id="tpl" aria-label="Load template">
    <option value="">Load template…</option>
    <option value="landing">Landing page</option>
    <option value="portfolio">Portfolio</option>
    <option value="python">Python playground</option>
    <option value="blank">Blank</option>
  </select>
  <button id="run" class="primary">Run</button>
  <button id="copy">Copy</button>
  <button id="dl">Download</button>
  <button id="reset">Reset</button>
</header>

<div class="main">
  <section class="pane">
    <div class="tabs">
      <button class="tab on" data-f="html">HTML</button>
      <button class="tab" data-f="css">CSS</button>
      <button class="tab" data-f="js">JavaScript</button>
      <button class="tab" data-f="py">Python</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
  </section>

  <section class="pane">
    <div class="tabs">
      <button class="tab on" data-v="preview">Preview</button>
      <button class="tab" data-v="console">Console</button>
    </div>
    <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals"></iframe>
    <pre id="console" hidden></pre>
  </section>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  var TEMPLATES = {
    landing: {
      html: '<main class="hero"><h1>Your Brand</h1><p>Write something powerful here.</p><button id="go">Get started</button></main>',
      css: 'body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#ff3b4e,#7a5cff);color:#fff}\nh1{font-size:56px;margin:0 0 10px}\nbutton{padding:14px 26px;border:0;border-radius:999px;font-weight:700;cursor:pointer}',
      js: 'document.getElementById("go").onclick = function(){ alert("Thanks for visiting!"); };',
      py: ''
    },
    portfolio: {
      html: '<header><h1>Your Name</h1><p>Designer and builder</p></header><section class="grid"><div class="card">Project one</div><div class="card">Project two</div><div class="card">Project three</div></section>',
      css: 'body{margin:0;padding:48px 24px;font-family:system-ui,sans-serif;background:#0b0b10;color:#eee}\nheader{max-width:900px;margin:0 auto 32px}\nh1{font-size:44px;margin:0}\nheader p{opacity:.6}\n.grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}\n.card{height:180px;border-radius:20px;background:linear-gradient(135deg,#ff3b4e,#7a5cff);display:grid;place-items:center;font-weight:700}',
      js: '',
      py: ''
    },
    python: {
      html: '<h1>Python playground</h1><p>Press Run. Your Python output appears in the Console tab.</p>',
      css: 'body{margin:0;padding:40px;font-family:system-ui,sans-serif;background:#0b0b10;color:#eee}',
      js: '',
      py: 'print("Hello from Python!")\nfor i in range(3):\n    print("Count", i)'
    },
    blank: {
      html: '<h1>Hello, world</h1>',
      css: 'body{margin:0;padding:32px;font-family:system-ui,sans-serif}',
      js: '',
      py: ''
    }
  };

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function load(){
    try{
      var v = JSON.parse(localStorage.getItem("rb_project"));
      return (v && v.html !== undefined) ? v : null;
    }catch(e){ return null; }
  }
  function save(){ try{ localStorage.setItem("rb_project", JSON.stringify(files)); }catch(e){} }

  var files = load() || clone(TEMPLATES.landing);
  var active = "html", timer = null, py = null;

  function doc(){
    return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' +
      files.css + '</style></head><body>' + files.html +
      '<script>' + files.js + '<\/script></body></html>';
  }

  function preview(){ $("frame").srcdoc = doc(); }
  function schedule(){ clearTimeout(timer); timer = setTimeout(preview, 350); }

  function showTab(f){
    active = f;
    document.querySelectorAll("[data-f]").forEach(function(b){ b.classList.toggle("on", b.dataset.f === f); });
    $("editor").value = files[f];
    $("editor").placeholder = f === "py" ? "Write Python here, then press Run" : "";
  }

  function view(v){
    document.querySelectorAll("[data-v]").forEach(function(b){ b.classList.toggle("on", b.dataset.v === v); });
    $("frame").hidden = v !== "preview";
    $("console").hidden = v !== "console";
  }

  function log(t){ $("console").textContent = t; }

  /* Python runs in the browser through Pyodide (loads on first Run) */
  function loadPy(){
    if(py) return Promise.resolve(py);
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
      s.onload = function(){
        loadPyodide().then(function(p){ py = p; resolve(p); }).catch(reject);
      };
      s.onerror = function(){ reject(new Error("Could not load Python. Check your connection.")); };
      document.head.appendChild(s);
    });
  }

  async function runPy(){
    view("console");
    log("Loading Python (first run only, a few seconds)...");
    var out = "";
    try{
      var p = await loadPy();
      p.setStdout({ batched: function(s){ out += s + "\n"; } });
      p.setStderr({ batched: function(s){ out += s + "\n"; } });
      await p.runPythonAsync(files.py);
    }catch(e){
      out += "\nError: " + e.message;
    }
    log(out || "(no output)");
  }

  /* Events */
  document.querySelectorAll("[data-f]").forEach(function(b){
    b.onclick = function(){ showTab(b.dataset.f); };
  });
  document.querySelectorAll("[data-v]").forEach(function(b){
    b.onclick = function(){ view(b.dataset.v); };
  });

  $("editor").addEventListener("input", function(){
    files[active] = $("editor").value;
    save();
    schedule();
  });

  $("editor").addEventListener("keydown", function(e){
    if(e.key !== "Tab") return;
    e.preventDefault();
    var t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
    t.dispatchEvent(new Event("input"));
  });

  $("run").onclick = function(){
    preview();
    if(files.py && files.py.trim()) runPy();
    else view("preview");
  };

  $("copy").onclick = function(){
    if(!navigator.clipboard){ alert("Copy is not supported here. Use Download instead."); return; }
    navigator.clipboard.writeText(doc()).then(function(){ alert("Copied the full site code."); });
  };

  $("dl").onclick = function(){
    var blob = new Blob([doc()], {type:"text/html"});
    var a = document.createElement("a");
    var name = ($("name").value.trim() || "site").replace(/[^a-z0-9-_]+/gi, "-");
    a.href = URL.createObjectURL(blob);
    a.download = name + ".html";
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  $("tpl").onchange = function(e){
    var k = e.target.value;
    e.target.value = "";
    if(!k) return;
    if(!confirm("Replace your current code with this template?")) return;
    files = clone(TEMPLATES[k]);
    save();
    showTab("html");
    preview();
    view("preview");
  };

  $("reset").onclick = function(){
    if(!confirm("Clear everything and start fresh?")) return;
    files = clone(TEMPLATES.blank);
    save();
    showTab("html");
    preview();
  };

  /* Start */
  showTab("html");
  preview();
  view("preview");
})();
</script>
</body>
      </html>
